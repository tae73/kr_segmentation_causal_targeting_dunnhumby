<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="820" height="600" role="img" aria-label="분석 파이프라인: 거래 데이터에서 피처 엔지니어링을 거쳐 Track 1 세그멘테이션과 Track 2 인과 타겟팅으로 분기, 정책 학습으로 수렴해 최적 31% 타겟팅 규칙 도출">
  <rect x="1.5" y="1.5" width="817" height="597" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g font-family="'Apple SD Gothic Neo','Malgun Gothic','Pretendard','Helvetica Neue',system-ui,sans-serif">
    <text x="410" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#0F172A" letter-spacing="3">ANALYSIS PIPELINE</text>

    <!-- Input -->
    <rect x="270" y="60" width="280" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="410" y="85.5" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">거래 데이터 · 260만 거래</text>
    <line x1="410" y1="102" x2="410" y2="116" stroke="#94A3B8" stroke-width="1.5"/>
    <polygon points="406,115 414,115 410,122" fill="#94A3B8"/>

    <!-- Feature engineering -->
    <rect x="230" y="124" width="360" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="410" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">Feature Engineering · 피처 엔지니어링</text>
    <text x="410" y="164" text-anchor="middle" font-size="10.5" fill="#64748B">33개 피처 · RFM · 행동 · 카테고리 · 시간</text>

    <!-- Split connector -->
    <line x1="410" y1="176" x2="410" y2="200" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="230" y1="200" x2="590" y2="200" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="230" y1="200" x2="230" y2="216" stroke="#94A3B8" stroke-width="1.5"/>
    <polygon points="226,215 234,215 230,222" fill="#94A3B8"/>
    <line x1="590" y1="200" x2="590" y2="216" stroke="#94A3B8" stroke-width="1.5"/>
    <polygon points="586,215 594,215 590,222" fill="#94A3B8"/>

    <!-- Track 1 card -->
    <rect x="70" y="224" width="320" height="190" rx="14" fill="#FFFFFF" stroke="#E6E9EF" stroke-width="1.2"/>
    <rect x="90" y="240" width="88" height="23" rx="11.5" fill="#0E7C86"/>
    <text x="134" y="255.5" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">TRACK 1</text>
    <text x="188" y="257" font-size="13.5" font-weight="700" fill="#0F172A">고객 세그멘테이션</text>

    <rect x="110" y="280" width="240" height="27" rx="8" fill="#0E7C86" fill-opacity="0.07" stroke="#0E7C86" stroke-opacity="0.25"/>
    <text x="230" y="297.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0B6B73">NMF · k = 5</text>
    <line x1="230" y1="307" x2="230" y2="317" stroke="#94A3B8" stroke-width="1.4"/><polygon points="226.5,316 233.5,316 230,322" fill="#94A3B8"/>
    <rect x="110" y="320" width="240" height="27" rx="8" fill="#0E7C86" fill-opacity="0.07" stroke="#0E7C86" stroke-opacity="0.25"/>
    <text x="230" y="337.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0B6B73">K-Means · k = 7</text>
    <line x1="230" y1="347" x2="230" y2="357" stroke="#94A3B8" stroke-width="1.4"/><polygon points="226.5,356 233.5,356 230,362" fill="#94A3B8"/>
    <rect x="110" y="360" width="240" height="27" rx="8" fill="#0E7C86" fill-opacity="0.12" stroke="#0E7C86" stroke-opacity="0.4"/>
    <text x="230" y="377.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0B6B73">7개 고객 세그먼트</text>

    <!-- Track 2 card -->
    <rect x="430" y="224" width="320" height="190" rx="14" fill="#FFFFFF" stroke="#E6E9EF" stroke-width="1.2"/>
    <rect x="450" y="240" width="88" height="23" rx="11.5" fill="#6D28D9"/>
    <text x="494" y="255.5" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">TRACK 2</text>
    <text x="548" y="257" font-size="13.5" font-weight="700" fill="#0F172A">인과 타겟팅</text>

    <rect x="470" y="280" width="240" height="27" rx="8" fill="#6D28D9" fill-opacity="0.07" stroke="#6D28D9" stroke-opacity="0.25"/>
    <text x="590" y="297.5" text-anchor="middle" font-size="11" font-weight="600" fill="#5B21B6">PS 모델 (XGBoost) · AUC 0.989</text>
    <line x1="590" y1="307" x2="590" y2="317" stroke="#94A3B8" stroke-width="1.4"/><polygon points="586.5,316 593.5,316 590,322" fill="#94A3B8"/>
    <rect x="470" y="320" width="240" height="27" rx="8" fill="#6D28D9" fill-opacity="0.07" stroke="#6D28D9" stroke-opacity="0.25"/>
    <text x="590" y="337.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5B21B6">CATE 모델 6종 + Optuna (100 trials)</text>
    <line x1="590" y1="347" x2="590" y2="357" stroke="#94A3B8" stroke-width="1.4"/><polygon points="586.5,356 593.5,356 590,362" fill="#94A3B8"/>
    <rect x="470" y="360" width="240" height="27" rx="8" fill="#6D28D9" fill-opacity="0.12" stroke="#6D28D9" stroke-opacity="0.4"/>
    <text x="590" y="377.5" text-anchor="middle" font-size="12" font-weight="700" fill="#5B21B6">고객별 CATE</text>

    <!-- Converge -->
    <line x1="230" y1="414" x2="408" y2="442" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="590" y1="414" x2="412" y2="442" stroke="#94A3B8" stroke-width="1.5"/>
    <polygon points="406,441 414,441 410,448" fill="#94A3B8"/>

    <!-- Policy learning -->
    <rect x="250" y="450" width="320" height="48" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/>
    <text x="410" y="472" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3730A3">정책 학습 · Policy Learning</text>
    <text x="410" y="488" text-anchor="middle" font-size="10.5" fill="#6366F1">세그먼트 = 조정변수(moderator) × CATE</text>
    <line x1="410" y1="498" x2="410" y2="512" stroke="#94A3B8" stroke-width="1.5"/>
    <polygon points="406,511 414,511 410,518" fill="#94A3B8"/>

    <!-- Final -->
    <rect x="215" y="520" width="390" height="56" rx="14" fill="#4F46E5"/>
    <text x="410" y="545" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">최적 31% 타겟팅</text>
    <text x="410" y="565" text-anchor="middle" font-size="13" font-weight="700" fill="#C7D2FE">+$2,426 · 125% ROI</text>
  </g>
</svg>
